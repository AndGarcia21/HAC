<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Proyecto Luminaria</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: url("imagenes/fondo.png") no-repeat center center;
    background-size: cover;
}

.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.25);
    top: 0;
    left: 0;
}

.menu {
    position: relative;
    z-index: 2;
    height: 100%;
    
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.logo {
    width: 400px;
    margin-bottom: 40px;
}

.boton {
    width: 250px;
    margin: 15px;
    cursor: pointer;
    transition: transform 0.2s, filter 0.2s;
}

.boton:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
}
</style>

</head>

<body>

<div class="overlay"></div>

<div class="menu">

    <img src="imagenes/logo.png" class="logo">

    <img src="imagenes/botonluminaria.png" class="boton"
         onclick="window.location.href='luminaria.html'">

    <img src="imagenes/botoncaja.png" class="boton"
         onclick="window.location.href='caja.html'">

    <img src="imagenes/botonvr.png" class="boton"
         onclick="window.location.href='vr.html'">

</div>

</body>
</html>
