<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista 360°</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}

.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;

    width: 60px;
    height: 60px;

    border-radius: 15px;
    border: none;

    background: #00ff88;
    font-size: 28px;
    font-weight: bold;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.gyro-btn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;

    padding: 15px 25px;
    border-radius: 10px;
    border: none;

    background: #00ff88;
    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.viewer {
    width: 100vw;
    height: 100vh;
    border: none;
}
</style>

</head>

<body>

<button class="back-btn" onclick="window.location.href='index.html'">
←
</button>

<button class="gyro-btn" onclick="activarGiro()">
Activar movimiento
</button>

<iframe 
    class="viewer"
    src="https://momento360.com/e/u/5aa4fab75edf44fea4c2635e62f45e7e?utm_campaign=embed&utm_source=other&heading=0&pitch=0&field-of-view=100&size=medium&display-plan=true"
    allow="gyroscope; accelerometer; fullscreen"
    allowfullscreen>
</iframe>

<script>
function activarGiro() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {

        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    alert("Movimiento activado, ahora usa el botón VR dentro de la imagen");
                }
            })
            .catch(console.error);

    } else {
        alert("Tu dispositivo ya debería permitir movimiento");
    }
}
</script>

</body>
</html>
