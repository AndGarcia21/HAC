<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista 360</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
}

.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;

    width: 60px;
    height: 60px;
    border-radius: 15px;
    border: none;
    background: #00ff88;
    font-size: 28px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.controls {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    gap: 20px;
}

.controls img {
    width: 70px;
    height: 70px;
    cursor: pointer;
}

#touchOverlay {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 5;
}
</style>
</head>

<body>

<button class="back-btn" onclick="window.location.href='index.html'">←</button>

<div id="touchOverlay"></div>

<div class="controls">
    <img src="imagenes/botonizquierdo.png" onclick="anterior()">
    <img src="imagenes/botonderecho.png" onclick="siguiente()">
</div>

<a-scene>

    <a-assets>
        <img id="img1" src="imagenes/foto360_1.png">
        <img id="img2" src="imagenes/foto360_2.png">
        <img id="img3" src="imagenes/foto360_3.png">
    </a-assets>

    <a-sky id="sky" src="#img1" rotation="0 -90 0"></a-sky>

    <a-entity id="camara"
        camera
        look-controls="magicWindowTrackingEnabled: false">
    </a-entity>

</a-scene>

<script>
let escenaActual = 0;

const escenas = ["#img1", "#img2", "#img3"];

function cambiarEscena() {
    document.querySelector('#sky')
        .setAttribute('src', escenas[escenaActual]);
}

function siguiente() {
    escenaActual++;
    if (escenaActual >= escenas.length) escenaActual = 0;
    cambiarEscena();
}

function anterior() {
    escenaActual--;
    if (escenaActual < 0) escenaActual = escenas.length - 1;
    cambiarEscena();
}

function activarGiro() {
    const cam = document.querySelector('#camara');

    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {

        DeviceOrientationEvent.requestPermission()
            .then(response => {
                if (response === 'granted') {
                    cam.setAttribute('look-controls', 'magicWindowTrackingEnabled: true');
                }
            });

    } else {
        cam.setAttribute('look-controls', 'magicWindowTrackingEnabled: true');
    }

    document.getElementById('touchOverlay').style.display = 'none';
}

window.addEventListener('load', () => {
    if (!(typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function')) {
        activarGiro();
    }
});

document.getElementById('touchOverlay').addEventListener('click', activarGiro);
</script>

</body>
</html>
