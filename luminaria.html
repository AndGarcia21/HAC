<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Luminaria</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body {
    margin: 0;
    overflow: hidden;
}

#camera {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
}

.fallback-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url("imagenes/fondo.png") no-repeat center center/cover;
    z-index: 0;
    display: none;
}

.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.25);
    z-index: 1;
    display: none;
}

model-viewer {
    position: relative;
    width: 100%;
    height: 100vh;
    z-index: 2;
    background: transparent;
}

.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 3;

    width: 60px;
    height: 60px;

    border-radius: 15px;
    border: none;

    background: #00ff88;
    color: black;

    font-size: 28px;
    font-weight: bold;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
</style>

</head>

<body>

<video id="camera" autoplay playsinline></video>
<div class="fallback-bg"></div>
<div class="overlay"></div>

<button class="back-btn" onclick="window.location.href='index.html'">
←
</button>

<model-viewer 
    src="models/luminaria.glb" 
    camera-orbit="0deg 75deg 150m"
    min-camera-orbit="auto auto 10m"
    max-camera-orbit="auto auto 500m"
    auto-rotate 
    camera-controls 
    exposure="1.2" 
    shadow-intensity="1">
</model-viewer>

<script>
const video = document.getElementById("camera");
const fallback = document.querySelector(".fallback-bg");
const overlay = document.querySelector(".overlay");

navigator.mediaDevices.getUserMedia({
    video: {
        facingMode: "environment"
    }
})
.then(stream => {
    video.srcObject = stream;
})
.catch(err => {
    console.log("No se pudo acceder a la cámara:", err);

    video.style.display = "none";
    fallback.style.display = "block";
    overlay.style.display = "block";
});
</script>

</body>
</html>
